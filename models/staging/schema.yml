version: 2

models:

  - name: stg_customers
    description: "Staging model for cleaned customer data"
    columns:
      - name: customer_id
        description: "Unique identifier for each customer"
        tests: [not_null, unique]
      - name: email
        description: "Email address of the customer"
        tests: [not_null]
      - name: signup_date
        description: "Date the customer signed up"
        tests: [not_null]

  - name: stg_products
    description: "Staging model for cleaned product catalog"
    columns:
      - name: product_id
        description: "Unique identifier for each product"
        tests: [not_null, unique]
      - name: price_gbp
        description: "Price of the product in GBP"

  - name: stg_transactions
    description: "Staging model for cleaned transaction data"
    columns:
      - name: transaction_id
        description: "Unique transaction ID"
        tests: [not_null, unique]
      - name: customer_id
        description: "Foreign key to the customer table"
        tests: [not_null]
      - name: product_id
        description: "Foreign key to the product table"
        tests: [not_null]
      - name: transaction_date
        description: "Date the transaction occurred"
        tests: [not_null]
